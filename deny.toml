# cargo-deny configuration: license allow list for Apache-2.0 compatibility.
[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib", "0BSD", "Unlicense", "MIT-0",
    "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
yanked = "deny"
# Transitive via `tokenizers` (optional `--features tokenizer`). No maintained
# drop-in for `paste`; upstream issue tracked as RUSTSEC-2024-0436.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; pulled in by tokenizers only" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
