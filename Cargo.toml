[package]
name = "metrum-ai-bench-cli"
version = "1.4.0"
edition = "2021"
rust-version = "1.85"
description = "Metrum AI Bench CLI: load testing and benchmarking tools for OpenAI-compatible LLM, VLM, ASR and image generation endpoints"
license = "Apache-2.0"
authors = ["Chetan Gadgil", "Metrum AI, Inc."]
repository = "https://github.com/metrum-ai/bench-cli"
homepage = "https://github.com/metrum-ai/bench-cli"
readme = "README.md"
keywords = ["benchmark", "llm", "load-testing", "openai", "inference"]
categories = ["command-line-utilities", "development-tools::profiling"]
publish = true
autobins = false
exclude = [
    ".github/**",
    ".cursor/**",
    "dummy-model-server/**",
    "scripts/live/**",
    "docs/reviews/**",
    "docs/HISTORY_REWRITE.md",
    "CLAUDE.md",
    "test-data/endpoints-4servers.yaml",
]

[lib]
name = "metrum_ai_bench"
path = "src/lib.rs"

[features]
default = []
tokenizer = ["dep:tokenizers"]
otlp = []

# Primary binary names (preferred).
[[bin]]
name = "metrum-ai-bench-cli-llm"
path = "src/bin/metrum-ai-bench-cli-llm.rs"

[[bin]]
name = "metrum-ai-bench-cli-vlm"
path = "src/bin/metrum-ai-bench-cli-vlm.rs"

[[bin]]
name = "metrum-ai-bench-cli-asr"
path = "src/bin/metrum-ai-bench-cli-asr.rs"

[[bin]]
name = "metrum-ai-bench-cli-imagegen"
path = "src/bin/metrum-ai-bench-cli-imagegen.rs"

[[bin]]
name = "metrum-ai-bench-cli"
path = "src/bin/metrum-ai-bench-cli.rs"

[[bin]]
name = "metrum-ai-bench-cli-prompts"
path = "src/bin/metrum-ai-bench-cli-prompts.rs"

[[bin]]
name = "metrum-ai-bench-cli-strategic"
path = "src/bin/metrum-ai-bench-cli-strategic.rs"

[[bin]]
name = "metrum-ai-bench-cli-mock-server"
path = "src/bin/metrum-ai-bench-cli-mock-server.rs"

[dependencies]
axum = "0.8.4"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
futures-util = "0.3.34"
log = "0.4.34"
rand = "0.10.2"
reqwest = { version = "0.12.28", features = ["json", "stream", "blocking", "multipart", "rustls-tls", "gzip"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
simplelog = "0.12.2"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jsonschema = { version = "0.56.0", default-features = false }
uuid = { version = "1.26.1", features = ["v4"] }
tempfile = "3.27.0"
parquet = { version = "59.3.0", default-features = false, features = ["zstd", "snap"] }
tokenizers = { version = "0.23.2", optional = true, default-features = false, features = ["onig"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
pin-project-lite = "0.2"
regex = { version = "1.13.1", features = ["std"] }
bytes = "1.12.1"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "telemetry_parser"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
