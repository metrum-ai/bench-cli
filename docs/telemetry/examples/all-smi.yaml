# Default smoke/E2E telemetry: Metrum all-smi fork (/metrics) plus engine metrics.
# Install: https://github.com/chetan-metrum-ai/all-smi/releases
#   curl -fsSL -o /tmp/all-smi.tgz \
#     https://github.com/chetan-metrum-ai/all-smi/releases/download/v0.26.3-metrum.4/all-smi-linux-x86_64.tar.gz
#   tar -xzf /tmp/all-smi.tgz -C /tmp && sudo install -m 0755 /tmp/all-smi /usr/local/bin/all-smi
#   all-smi api --port 9090
# The fork (v0.26.3-metrum.4) serves /metrics; /metric returns 404. It binds
# 0.0.0.0 (no bind flag), so firewall port 9090 on shared hosts.

default_interval_ms: 1000
timeout_ms: 800
sources:
  - name: all-smi
    url: http://127.0.0.1:9090/metrics
    interval_ms: 500
    include:
      - "^all_smi_(gpu|cpu|memory)_"
    units:
      # all-smi exports energy in millijoules; store joules (raw keeps mJ).
      all_smi_gpu_energy_hw_millijoules_total:
        scale: 0.001
        unit: J
  - name: vllm
    url: http://127.0.0.1:8000/metrics
    interval_ms: 1000
    include:
      - "^vllm:(gpu_cache_usage_perc|kv_cache_usage_perc|num_requests_(running|waiting)|num_preemptions_total|generation_tokens_total)$"
