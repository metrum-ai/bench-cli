# Default smoke/E2E telemetry: Metrum all-smi fork (/metric) plus engine metrics.
# Install: https://github.com/chetan-metrum-ai/all-smi
#   cargo install --git https://github.com/chetan-metrum-ai/all-smi --locked
#   all-smi api --port 9090
# Bind exporters to 127.0.0.1. Prefer /metric (fork); /metrics also works on upstream.

default_interval_ms: 1000
timeout_ms: 800
sources:
  - name: all-smi
    url: http://127.0.0.1:9090/metric
    interval_ms: 500
    include:
      - "^all_smi_(gpu|cpu|memory)_"
  - name: vllm
    url: http://127.0.0.1:8000/metrics
    interval_ms: 1000
    include:
      - "^vllm:(gpu_cache_usage_perc|kv_cache_usage_perc|num_requests_(running|waiting)|num_preemptions_total|generation_tokens_total)$"
