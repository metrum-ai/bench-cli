# NVIDIA dcgm-exporter. Install: see docs/telemetry/exporters.md
# scrape: http://127.0.0.1:9400/metrics

default_interval_ms: 1000
timeout_ms: 800
sources:
  - name: dcgm
    url: http://127.0.0.1:9400/metrics
    interval_ms: 500
    include:
      - "^DCGM_FI_DEV_(POWER_USAGE|GPU_UTIL|MEM_COPY_UTIL|GPU_TEMP|MEMORY_TEMP|FB_USED|FB_FREE|SM_CLOCK|TOTAL_ENERGY_CONSUMPTION)$"
      - "^DCGM_FI_PROF_(SM_ACTIVE|PIPE_TENSOR_ACTIVE|DRAM_ACTIVE)$"
    units:
      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION:
        scale: 0.001
        unit: J
      DCGM_FI_DEV_POWER_USAGE:
        scale: 1
        unit: W
