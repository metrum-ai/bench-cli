# Intel Gaudi Prometheus Metric Exporter.
# scrape: http://127.0.0.1:41611/metrics

default_interval_ms: 1000
timeout_ms: 800
sources:
  - name: gaudi
    url: http://127.0.0.1:41611/metrics
    interval_ms: 1000
    include:
      - "^habanalabs_(utilization|power_mW|energy)$"
      - "^habanalabs_temperature_(onchip|onboard)$"
      - "^habanalabs_memory_(used|free|total)_bytes$"
    units:
      habanalabs_power_mW:
        scale: 0.001
        unit: W
      habanalabs_energy:
        scale: 1
        unit: J
