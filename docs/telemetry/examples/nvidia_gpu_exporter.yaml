# utkuozdemir/nvidia_gpu_exporter (NVML without DCGM).
# scrape: http://127.0.0.1:9835/metrics

default_interval_ms: 1000
timeout_ms: 800
sources:
  - name: nvidia_gpu_exporter
    url: http://127.0.0.1:9835/metrics
    interval_ms: 1000
    include:
      - "^nvidia_smi_(power_draw_watts|utilization_gpu_ratio|temperature_gpu|energy_joules_total)$"
      - "^nvidia_smi_memory_(used|total)_bytes$"
    units:
      nvidia_smi_power_draw_watts:
        scale: 1
        unit: W
      nvidia_smi_energy_joules_total:
        scale: 1
        unit: J
