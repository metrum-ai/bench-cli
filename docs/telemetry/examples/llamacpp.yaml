# llama.cpp server (opt-in: --metrics).
# scrape: http://127.0.0.1:8080/metrics

default_interval_ms: 1000
timeout_ms: 800
sources:
  - name: llamacpp
    url: http://127.0.0.1:8080/metrics
    interval_ms: 1000
    include:
      - "^llamacpp:(kv_cache_usage_ratio|requests_(processing|deferred)|prompt_tokens_total|tokens_predicted_total|n_busy_slots_per_decode)$"
