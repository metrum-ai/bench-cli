# Supply-chain window (#293): every ecosystem entry applies a seven-day
# cooldown to routine version updates (default-days; cooldown never delays
# security updates, and security PRs like #266/#285 remain expedited).
# Supported for cargo, gomod and github-actions per the Dependabot options
# reference; unsupported keys would fail configuration validation.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    ignore:
      # parquet pins thrift 0.17; no resolvable path to patched ≥0.23 yet
      - dependency-name: "thrift"
  - package-ecosystem: gomod
    directory: "/dummy-model-server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
