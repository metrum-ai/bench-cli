name: Bug report
description: Report a bug in Metrum AI Bench
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in the sections below so we can reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands and config (redact API keys).
      placeholder: |
        metrum-ai-bench-cli llm --url ... --model ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `metrum-ai-bench-cli --version` (or crate version).
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, rustc/Go if building from source.
  - type: textarea
    id: logs
    attributes:
      label: Logs / JSONL snippets
      description: Relevant stderr or summary fields (redact secrets).
