name: Pre-tag certification dry run

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit (40 hexadecimal characters)
        required: true
        type: string
      version:
        description: Candidate version (SemVer without a v prefix)
        required: true
        type: string

permissions:
  contents: read

env:
  CERT_CANDIDATE: ${{ inputs.candidate_sha }}
  CERT_VERSION: ${{ inputs.version }}

jobs:
  validate-inputs:
    name: Validate explicit candidate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on invalid candidate or version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          sha = os.environ.get('CERT_CANDIDATE', '')
          version = os.environ.get('CERT_VERSION', '')
          numeric = r'(?:0|[1-9][0-9]*)'
          identifier = rf'(?:{numeric}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver = rf'{numeric}\.{numeric}\.{numeric}(?:-{identifier}(?:\.{identifier})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate_sha must be exactly 40 lowercase hexadecimal characters')
          if not re.fullmatch(semver, version):
              raise SystemExit('version must be valid SemVer without a v prefix')
          PY

  verify:
    needs: validate-inputs
    name: Verify candidate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify candidate and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERT_CANDIDATE"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$crate_version" = "$CERT_VERSION"
          cargo publish --dry-run --locked --features otlp,tokenizer

  codeql:
    needs: validate-inputs
    name: BC-CI-006 CodeQL candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Assert candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CERT_CANDIDATE"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /pretag-candidate/language:rust

  dummy-checks:
    needs: validate-inputs
    name: BC-CI-006 dummy server checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Assert candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CERT_CANDIDATE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: dummy-model-server/go.sum
      - name: gofmt, test, vet and govulncheck
        working-directory: dummy-model-server
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then printf '%s\n' "$unformatted"; exit 1; fi
          go test ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  dummy-binaries:
    name: Build dummy ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64}
          - {target: aarch64-unknown-linux-gnu, goos: linux, goarch: arm64}
          - {target: x86_64-apple-darwin, goos: darwin, goarch: amd64}
          - {target: aarch64-apple-darwin, goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Assert candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CERT_CANDIDATE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: dummy-model-server/go.sum
      - name: Cross-compile dummy model server
        working-directory: dummy-model-server
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' -o dummy-model-server ./cmd/dummy-model-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pretag-dummy-${{ matrix.target }}
          path: dummy-model-server/dummy-model-server
          if-no-files-found: error

  package:
    name: BC-PACK-001 build ${{ matrix.target }}
    needs: dummy-binaries
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild@sha256:d8313491ec5798de0633fdc1c5753761bff79967bea69076020dc78121b2cca8
      options: --user root
    env:
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SDKROOT: /opt/MacOSX11.3.sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.17, rust_target: x86_64-unknown-linux-gnu}
          - {target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.17, rust_target: aarch64-unknown-linux-gnu}
          - {target: x86_64-apple-darwin, zig_target: x86_64-apple-darwin, rust_target: x86_64-apple-darwin}
          - {target: aarch64-apple-darwin, zig_target: aarch64-apple-darwin, rust_target: aarch64-apple-darwin}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Assert candidate and non-root-owned checkout in root container
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -eq 0
          test "$(stat -c %u "$GITHUB_WORKSPACE")" -ne 0
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CERT_CANDIDATE"
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$version" = "$CERT_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pretag-dummy-${{ matrix.target }}
          path: dummy-bin
      - name: Add Rust target
        run: rustup target add "${{ matrix.rust_target }}"
      - name: Build release-equivalent binaries
        run: cargo zigbuild --locked --release --features otlp,tokenizer --target "${{ matrix.zig_target }}" --bins
      - name: Package and compare every tracked documentation byte
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CERT_CANDIDATE"
          root="metrum-ai-bench-cli-v${CERT_VERSION}-${{ matrix.target }}"
          mkdir -p "$root/bin"
          mapfile -t bins < <(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; m=json.load(sys.stdin); [print(t["name"]) for t in m["packages"][0]["targets"] if "bin" in t.get("kind", [])]')
          test "${#bins[@]}" -gt 0
          for name in "${bins[@]}"; do
            path="target/${{ matrix.rust_target }}/release/$name"
            test -x "$path"
            cp "$path" "$root/bin/"
          done
          cp dummy-bin/dummy-model-server "$root/bin/dummy-model-server"
          chmod 0755 "$root/bin/dummy-model-server"
          test -x "$root/bin/metrum-ai-bench-cli"
          test -x "$root/bin/metrum-ai-bench-cli-mock-server"
          cp LICENSE NOTICE THIRD_PARTY_LICENSES README.md TRADEMARKS.md "$root/"
          git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD docs | tar -x -C "$root"
          cp -a examples "$root/"
          cp -a test-data "$root/"
          tar -czf "$root.tar.gz" "$root"
          python3 scripts/check_release_readme_links.py "$root.tar.gz"
          sha256sum "$root.tar.gz" > "$root.tar.gz.sha256"
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          mv metrum-ai-bench-cli.cdx.json "metrum-ai-bench-cli-${{ matrix.target }}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pretag-release-${{ matrix.target }}
          path: |
            metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz
            metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz.sha256
            metrum-ai-bench-cli-${{ matrix.target }}.cdx.json
          if-no-files-found: error

  smoke:
    name: BC-PACK-002 smoke ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - {target: aarch64-apple-darwin, runner: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Assert candidate checkout
        run: test "$(git rev-parse HEAD)" = "$CERT_CANDIDATE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pretag-release-${{ matrix.target }}
          path: pretag-artifact
      - name: Verify, extract and smoke exact archive
        shell: bash
        working-directory: pretag-artifact
        run: |
          set -euo pipefail
          root="metrum-ai-bench-cli-v${CERT_VERSION}-${{ matrix.target }}"
          archive="$root.tar.gz"
          shasum -a 256 -c "$archive.sha256"
          test -s "metrum-ai-bench-cli-${{ matrix.target }}.cdx.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["bomFormat"] == "CycloneDX"' "metrum-ai-bench-cli-${{ matrix.target }}.cdx.json"
          python3 ../scripts/validation/cert/check_package_docs.py --revision "$CERT_CANDIDATE" --archive "$archive"
          tar -xzf "$archive"
          test -f "$root/TRADEMARKS.md"
          test -f "$root/docs/RESULTS_PUBLICATION_POLICY.md"
          test -f "$root/docs/CLAIMS_LEDGER.md"
          test -f "$root/examples/sut.example.json"
          test -f "$root/test-data/llm-hi.jsonl"
          test -f "$root/NOTICE"
          test -f "$root/THIRD_PARTY_LICENSES"
          test -f "$root/test-data/asr/input.jsonl"
          test -f "$root/test-data/asr/truth.jsonl"
          wavs=("$root"/test-data/asr/*.wav); test "${#wavs[@]}" -eq 3
          test -f "$root/test-data/vlm/shapes-512.png"
          test -f "$root/test-data/vlm/prompts.jsonl"
          test -f "$root/test-data/negative/header-only-invalid.mp3"
          test ! -e "$root/test-data/dummy.mp3"
          test "$("$root/bin/metrum-ai-bench-cli" --version)" = "metrum-ai-bench-cli $CERT_VERSION"
          "$root/bin/metrum-ai-bench-cli" --help | grep -qi benchmark
          "$root/bin/metrum-ai-bench-cli" selftest
          "$root/bin/metrum-ai-bench-cli-mock-server" --help | grep -qi mock
          dummy_help=$("$root/bin/dummy-model-server" -h 2>&1 || true)
          printf '%s\n' "$dummy_help" | grep -qi 'Listen port'
