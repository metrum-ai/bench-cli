name: Deploy Docs

# Triggers:
#   - Push to main -> dev preview, published to Restic (build check + archive)
#   - Push of a v* tag -> release docs, published to Restic (archive)
#
# This workflow no longer deploys to docs.metrum.ai. The live site is fed from
# the GitHub Release instead: release.yml attaches the docs bundle
# (metrum-ai-bench-cli-docs-<tag>.tar.gz + .sha256 + versions manifest) to
# each Release, and the docs web host pulls the newest Release bundle itself
# (metrum-internal-infra-admin: newsite/scripts/sync-metrum-ai-bench-cli-docs.sh).
# No self-hosted runner or host-specific path is involved.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    name: Publish external docs to Restic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      latest: ${{ steps.resolve.outputs.latest }}
      latest_version: ${{ steps.resolve.outputs.latest_version }}
      release_versions: ${{ steps.resolve.outputs.release_versions }}
      restic_env: ${{ steps.resolve.outputs.restic_env }}
    env:
      RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY }}
      RESTIC_PASSWORD_INPUT: ${{ secrets.RESTIC_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: external-docs/package-lock.json

      - name: Install Restic
        run: |
          set -euo pipefail
          RESTIC_VERSION="0.18.1"
          RESTIC_SHA256="680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d"
          curl -fsSL -o /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "${RESTIC_SHA256}  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 /tmp/restic.bz2
          chmod +x /tmp/restic
          sudo mv /tmp/restic /usr/local/bin/restic
          restic version

      - name: Materialize Restic credential file
        run: |
          set -euo pipefail
          if [ -z "${RESTIC_REPOSITORY:-}" ]; then
            echo "Missing required GitHub secrets for docs publishing." >&2
            echo "Configure RESTIC_REPOSITORY and RESTIC_PASSWORD in repository secrets." >&2
            exit 1
          fi
          credential_file="${RUNNER_TEMP}/restic-bench-cli-docs.credential"
          umask 077
          printf '%s' "${RESTIC_PASSWORD_INPUT}" > "${credential_file}"
          if [ ! -s "${credential_file}" ]; then
            echo "Missing required GitHub secrets for docs publishing." >&2
            echo "Configure RESTIC_REPOSITORY and RESTIC_PASSWORD in repository secrets." >&2
            exit 1
          fi
          echo "RESTIC_PASSWORD_FILE=${credential_file}" >> "$GITHUB_ENV"

      - name: Resolve docs VERSION, LATEST policy, and RESTIC_ENV
        id: resolve
        run: |
          set -euo pipefail

          # A tag counts as a real release only if it does not carry a
          # prerelease marker. Mirrors release.yml's own prerelease test
          # (contains '-rc.' / '-alpha.' / '-beta.') so docs promotion never
          # disagrees with what the GitHub Release / crates.io gates decide.
          is_prerelease() {
            case "$1" in
              *-rc.*|*-alpha.*|*-beta.*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Newest tag that is a real release (excludes -rc./-alpha./-beta.).
          # Used as the DOCS_LATEST_VERSION fallback whenever the current
          # push is not itself promoting a new latest.
          latest_release_tag() {
            git tag --list 'v*' --sort=-v:refname 2>/dev/null | while read -r t; do
              if ! is_prerelease "$t"; then
                echo "$t"
                break
              fi
            done
          }

          # Full accumulated version history for the versions.json manifest
          # (see Chetan's PR #103 review: a manifest built from a single
          # VERSION drops every earlier release from the version picker on
          # each new publish). Includes prerelease tags too, since after a
          # restore they do have their own live versioned path.
          all_release_tags() {
            git tag --list 'v*' --sort=-v:refname 2>/dev/null | tr '\n' ' '
          }

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            restic_env="production"
            if is_prerelease "${version}"; then
              latest_flag="0"
              latest_version="$(latest_release_tag)"
              if [ -z "${latest_version}" ]; then
                latest_version="${version}-fallback"
              fi
              echo "Tag push ${version}: prerelease tag, publishing with LATEST=0 (latest stays ${latest_version}) to restic-env-production." \
                >> "$GITHUB_STEP_SUMMARY"
            else
              latest_flag="1"
              latest_version="${version}"
              echo "Tag push ${version}: publishing release with LATEST=1 to restic-env-production." \
                >> "$GITHUB_STEP_SUMMARY"
            fi
            release_versions="$(all_release_tags)"
          else
            short="$(git rev-parse --short=7 HEAD)"
            version="v0.dev-${short}"
            latest_flag="0"
            latest_version="$(latest_release_tag)"
            if [ -z "${latest_version}" ] || [ "${latest_version}" = "${version}" ]; then
              latest_version="${version}-fallback"
            fi
            restic_env="staging"
            release_versions="$(all_release_tags) ${version}"
            echo "Branch push ${short}: publishing dev preview ${version} with LATEST=0 to restic-env-staging." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "version=${version}"
            echo "latest=${latest_flag}"
            echo "latest_version=${latest_version}"
            echo "release_versions=${release_versions}"
            echo "restic_env=${restic_env}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and package docs
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          LATEST_VERSION: ${{ steps.resolve.outputs.latest_version }}
          LATEST_FLAG: ${{ steps.resolve.outputs.latest }}
          RELEASE_VERSIONS: ${{ steps.resolve.outputs.release_versions }}
        working-directory: external-docs
        run: |
          set -euo pipefail
          npm ci
          make build VERSION="${VERSION}"
          if [ "${LATEST_FLAG}" = "1" ]; then
            make build-latest VERSION="${VERSION}"
          fi
          make package VERSION="${VERSION}" DOCS_LATEST_VERSION="${LATEST_VERSION}" DOCS_RELEASE_VERSIONS="${RELEASE_VERSIONS}"

      - name: Publish docs to Restic
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          RESTIC_ENV: ${{ steps.resolve.outputs.restic_env }}
        working-directory: external-docs/dist
        run: |
          set -euo pipefail
          ARCHIVE="metrum-ai-bench-cli-docs-${VERSION}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"
          MANIFEST="metrum-ai-bench-cli-docs-versions.json"

          artifacts=("${ARCHIVE}")
          [ -f "${CHECKSUM}" ] && artifacts+=("${CHECKSUM}")
          [ -f "${MANIFEST}" ] && artifacts+=("${MANIFEST}")

          restic backup --json \
            --tag docs-releases \
            --tag metrum-ai-bench-cli-docs \
            --tag "${VERSION}" \
            --tag "restic-env-${RESTIC_ENV}" \
            "${artifacts[@]}"
          echo "Published ${VERSION} to Restic."

      - name: Verify Restic snapshot
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          RESTIC_ENV: ${{ steps.resolve.outputs.restic_env }}
        run: |
          set -euo pipefail
          SNAP_COUNT=$(restic snapshots --json \
            --tag "docs-releases,metrum-ai-bench-cli-docs,${VERSION},restic-env-${RESTIC_ENV}" \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "${SNAP_COUNT}" -lt 1 ]; then
            echo "ERROR: No Restic snapshot found with expected tags." >&2
            exit 1
          fi
          echo "Verified: ${SNAP_COUNT} snapshot(s) for ${VERSION}."
