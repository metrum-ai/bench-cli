name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Recurring advisory scan (new RUSTSEC entries after merge).
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-latest
    env:
      # Serialize rustc/link to reduce peak memory on GitHub-hosted runners.
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # The dummy-server end-to-end tests skip themselves without a Go
      # toolchain, so install one and require it below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: dummy-model-server/go.sum
      - name: copyright and SPDX headers
        run: bash scripts/check_headers.sh
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --all-features
        env:
          METRUM_BENCH_REQUIRE_DUMMY: "1"
      - name: package dry run
        run: cargo package --allow-dirty

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: cargo check (MSRV)
        run: cargo check --all-targets --all-features
      - name: cargo test (MSRV lib)
        run: cargo test --lib --all-features

  secrets:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --verbose

  coverage:
    name: core line coverage (80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-llvm-cov
      - name: enforce core coverage
        run: >-
          cargo llvm-cov --lib --all-features --fail-under-lines 80
          --ignore-filename-regex
          'src/(args_common|endpoints|error|jsonl|lib|prompt_inputs)\.rs'

  deny:
    name: cargo deny check (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # v2.1.1 ships cargo-deny 0.20.2 (CVSS 4.0 advisory DB support)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
