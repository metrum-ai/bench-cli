name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Recurring advisory scan (new RUSTSEC entries after merge).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-latest
    env:
      # Serialize rustc/link to reduce peak memory on GitHub-hosted runners.
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The dummy-server end-to-end tests skip themselves without a Go
      # toolchain, so install one and require it below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: dummy-model-server/go.sum
      - name: copyright and SPDX headers
        run: bash scripts/check_headers.sh
      - name: naming rule negative test
        run: bash scripts/tests/check_naming_test.sh
      - name: zero unsafe in src/
        run: |
          set -euo pipefail
          hits="$(grep -rn --include='*.rs' -E '\bunsafe\b' src/ | grep -vE ':[0-9]+:[[:space:]]*//' || true)"
          if [[ -n "$hits" ]]; then
            echo "$hits" >&2
            echo "unsafe found in src/; first-party code must remain safe Rust" >&2
            exit 1
          fi
          echo "unsafe check: ok"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --all-features
        env:
          METRUM_BENCH_REQUIRE_DUMMY: "1"
      - name: package dry run
        run: cargo package --allow-dirty

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: DCO sign-off
        run: >-
          bash scripts/check_dco.sh
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check (MSRV)
        run: cargo check --all-targets --all-features
      - name: cargo test (MSRV lib)
        run: cargo test --lib --all-features

  secrets:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          # HEAD only: default --all also scans other remote PR branches
          # fetched via fetch-depth: 0 and fails CI on unrelated work.
          gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="HEAD"
      - name: gitleaks custom-rule fixtures
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          bash scripts/tests/gitleaks/run.sh

  coverage:
    name: core line coverage (80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-llvm-cov
      - name: enforce core coverage
        run: >-
          cargo llvm-cov --lib --all-features --fail-under-lines 80
          --ignore-filename-regex
          'src/(args_common|endpoints|error|jsonl|lib|prompt_inputs|prompt_library)\.rs'

  deny:
    name: cargo deny check (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v2.1.1 ships cargo-deny 0.20.2 (CVSS 4.0 advisory DB support)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  weekly-hygiene:
    name: weekly dep hygiene (report-only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo-geiger report
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo install cargo-geiger --locked
          cargo geiger --all-features > cargo-geiger-report.txt 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cargo-geiger-report
          path: cargo-geiger-report.txt
          if-no-files-found: warn
      - name: cargo-outdated report
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo install cargo-outdated --locked
          cargo outdated --workspace --format json > cargo-outdated.json || true
          cargo outdated --workspace > cargo-outdated.txt || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cargo-outdated-report
          path: |
            cargo-outdated.json
            cargo-outdated.txt
          if-no-files-found: warn
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # nightly (udeps)
        with:
          toolchain: nightly
      - name: cargo-udeps report
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo +nightly install cargo-udeps --locked
          cargo +nightly udeps --all-targets --all-features \
            > cargo-udeps-report.txt 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cargo-udeps-report
          path: cargo-udeps-report.txt
          if-no-files-found: warn

  # Runs cargo test and docs packaging on the org self-hosted runner labelled
  # bench-cli. Fork pull requests are skipped: untrusted code must not execute
  # on a machine that also holds org credentials. Do not add this job as a
  # required status check until that runner is confirmed online; a missing
  # self-hosted runner queues indefinitely.
  self-hosted:
    name: test (self-hosted bench-cli)
    if: >
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, bench-cli]
    timeout-minutes: 45
    concurrency:
      group: bench-cli-ci-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: dummy-model-server/go.sum
      - name: cargo test
        run: cargo test --all-targets --all-features
        env:
          METRUM_BENCH_REQUIRE_DUMMY: "1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: external-docs/package-lock.json
      # Validates the same Makefile package path release.yml docs-bundle uses.
      - name: package docs bundle
        working-directory: external-docs
        shell: bash
        run: |
          set -euo pipefail
          version="v0.0.0-ci"
          all_tags="$(git tag --list 'v*' --sort=-v:refname | tr '\n' ' ')"
          npm ci
          make build VERSION="${version}"
          make build-latest VERSION="${version}"
          make package VERSION="${version}" \
            DOCS_LATEST_VERSION="${version}" \
            DOCS_RELEASE_VERSIONS="${all_tags} ${version}"
          archive="dist/metrum-ai-bench-cli-docs-${version}.tar.gz"
          checksum="${archive}.sha256"
          manifest="dist/metrum-ai-bench-cli-docs-versions.json"
          test -f "${archive}"
          test -f "${checksum}"
          test -f "${manifest}"
          (cd dist && sha256sum -c "metrum-ai-bench-cli-docs-${version}.tar.gz.sha256")
          # Buffer the listing so grep -q cannot SIGPIPE tar under pipefail.
          archive_listing="$(tar -tzf "${archive}")"
          grep -Fq "metrum-ai-bench-cli/${version}/" <<<"${archive_listing}"
          grep -Fq "metrum-ai-bench-cli/latest/" <<<"${archive_listing}"
          grep -Fq "metrum-ai-bench-cli/versions.json" <<<"${archive_listing}"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "${manifest}"
          ls -l dist/

  # Hub dataset must stay public and license-aligned with docs/datasets/DATASET_CARD.md.
  # Manual confirmation that upstream prompt sources permit Apache-2.0 remains a
  # human operator step (not automated here).
  hf-visibility:
    name: hf-visibility (prompt-library)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require public ungated Hub dataset matching local card license
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk '
            BEGIN { in_fm=0 }
            /^---[[:space:]]*$/ { in_fm++; next }
            in_fm == 1 && $1 == "license:" { print $2; exit }
          ' docs/datasets/DATASET_CARD.md)"
          test -n "${expected}"
          echo "local card license: ${expected}"
          curl -sfL "https://huggingface.co/api/datasets/metrum-ai/prompt-library" \
            | jq -e --arg lic "${expected}" '
                .private == false
                and (.gated == false or .gated == null)
                and (
                  (.cardData.license | tostring | ascii_downcase)
                  == ($lic | ascii_downcase)
                )
              '
          echo "hf-visibility: ok"
