name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    # Recurring advisory scan (new RUSTSEC entries after merge).
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rust path filter self-test
        run: bash .github/scripts/rust_changes_test.sh
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_BASE: ${{ github.event.base_sha }}
          EVENT_HEAD: ${{ github.event.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          base="${PR_BASE}"
          head="${PR_HEAD}"
          case "${EVENT_NAME}" in
            merge_group) base="${EVENT_BASE}"; head="${EVENT_HEAD}" ;;
            push) base="${PUSH_BEFORE}"; head="${CURRENT_SHA}" ;;
          esac
          bash .github/scripts/rust_changes.sh "${EVENT_NAME}" "${base}" "${head}"

  check:
    name: fmt, clippy, test (stable)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Two jobs use available cores while keeping memory bounded; one underutilized the runner.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The dummy-server end-to-end tests skip themselves without a Go
      # toolchain, so install one and require it below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: dummy-model-server/go.sum
      - name: copyright and SPDX headers
        run: cargo --locked xtask check-headers
      - name: naming rule negative test
        run: cargo --locked test -p xtask naming_rejects_metrum_bench_and_accepts_transition -- --exact
      - name: live headline gate self-test
        run: cargo --locked test -p xtask assert_headline_pass_and_fail_cases -- --exact
      - name: serve configuration and SUT tests
        run: cargo --locked test -p xtask serving_defaults_generate_valid_sut_for_all_modalities_offline -- --exact
      - name: offline telemetry analysis contracts
        run: cargo --locked test -p xtask
      - name: zero unsafe in src/
        run: |
          set -euo pipefail
          hits="$(grep -rn --include='*.rs' -E '\bunsafe\b' src/ | grep -vE ':[0-9]+:[[:space:]]*//' || true)"
          if [[ -n "$hits" ]]; then
            echo "$hits" >&2
            echo "unsafe found in src/; first-party code must remain safe Rust" >&2
            exit 1
          fi
          echo "unsafe check: ok"
      - name: cargo fmt
        run: cargo --locked fmt --all -- --check
      - name: cargo clippy
        run: cargo --locked clippy --all-targets --all-features -- -D warnings
      - name: build dummy model server
        working-directory: dummy-model-server
        run: go build -o ${{ runner.temp }}/dummy-model-server ./cmd/dummy-model-server
      - name: cargo test
        run: cargo --locked test --all-targets --all-features
        env:
          METRUM_BENCH_REQUIRE_DUMMY: "1"
          METRUM_BENCH_DUMMY_BIN: ${{ runner.temp }}/dummy-model-server
      - name: cargo build (bins for documentation checks)
        run: cargo --locked build --bins
      - name: campaign preset commands against mock
        run: cargo --locked xtask check-presets
      - name: generated CLI help is current
        run: cargo --locked xtask render-cli-help --check
      - name: documentation links and command blocks
        run: cargo --locked xtask check-docs
      - name: package dry run
        run: cargo --locked package --allow-dirty --target-dir ${{ runner.temp }}/pkg

  check_stub:
    name: fmt, clippy, test (stable)
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Rust sources unchanged; required check intentionally passes.'

  dco:
    name: dco
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: github.event_name == 'pull_request'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name == 'pull_request'
      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        run: >-
          cargo --locked xtask check-dco
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
      - name: merge queue DCO pass-through
        if: github.event_name == 'merge_group'
        run: echo 'DCO was checked on the pull request before merge queue.'

  msrv:
    name: MSRV 1.89
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Validate Rust versions of all locked packages
        run: cargo --locked xtask check-msrv --msrv 1.89.0
      - name: cargo check (MSRV)
        run: cargo --locked check --all-targets --all-features
      - name: cargo test (MSRV lib)
        run: cargo --locked test --lib --all-features

  msrv_stub:
    name: MSRV 1.89
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Rust sources unchanged; required check intentionally passes.'

  secrets:
    name: secret scanning (gitleaks)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.rust == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          # HEAD only: default --all also scans other remote PR branches
          # fetched via fetch-depth: 0 and fails CI on unrelated work.
          gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="HEAD"
      - name: gitleaks custom-rule fixtures
        if: needs.changes.outputs.rust == 'true'
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          cargo --locked xtask gitleaks-fixtures

  coverage:
    name: core line coverage (80%)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov
      - name: enforce core coverage
        run: >-
          cargo --locked llvm-cov --lib --all-features --fail-under-lines 80
          --ignore-filename-regex
          'src/(args_common|endpoints|error|jsonl|lib|prompt_inputs|prompt_library)\.rs'

  coverage_stub:
    name: core line coverage (80%)
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Rust sources unchanged; required check intentionally passes.'

  deny:
    name: cargo deny check (all)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v2.1.1 ships cargo-deny 0.20.2 (CVSS 4.0 advisory DB support)
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  deny_stub:
    name: cargo deny check (all)
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Rust sources unchanged; required check intentionally passes.'

  weekly-hygiene:
    name: weekly dep hygiene (report-only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo-geiger report
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo install cargo-geiger --locked
          cargo --locked geiger --all-features > cargo-geiger-report.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cargo-geiger-report
          path: cargo-geiger-report.txt
          if-no-files-found: warn
      - name: cargo-outdated report
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo install cargo-outdated --locked
          cargo --locked outdated --workspace --format json > cargo-outdated.json || true
          cargo --locked outdated --workspace > cargo-outdated.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cargo-outdated-report
          path: |
            cargo-outdated.json
            cargo-outdated.txt
          if-no-files-found: warn
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # nightly (udeps)
        with:
          toolchain: nightly
      - name: cargo-udeps report
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo +nightly install cargo-udeps --locked
          cargo +nightly --locked udeps --all-targets --all-features \
            > cargo-udeps-report.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cargo-udeps-report
          path: cargo-udeps-report.txt
          if-no-files-found: warn

  # Runs cargo test and docs packaging on the org ARC runner scale set.
  # Fork pull requests are skipped: untrusted code must not execute on an
  # org runner. Keep the job name stable because it is a required status check.
  self-hosted:
    name: test (self-hosted bench-cli)
    needs: changes
    if: >
      needs.changes.outputs.rust == 'true' &&
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: bench-cli-arc
    timeout-minutes: 45
    concurrency:
      # The runner serializes different refs in its queue. Only superseded PR
      # runs on the same ref are cancelled; main is never cancelled.
      group: bench-cli-self-hosted-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install native build dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            build-essential \
            make \
            pkg-config \
            unzip \
            xz-utils
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: dummy-model-server/go.sum
      - name: build dummy model server
        working-directory: dummy-model-server
        run: go build -o ${{ runner.temp }}/dummy-model-server ./cmd/dummy-model-server
      - name: cargo test
        run: cargo --locked test --all-targets --all-features
        env:
          METRUM_BENCH_REQUIRE_DUMMY: "1"
          METRUM_BENCH_DUMMY_BIN: ${{ runner.temp }}/dummy-model-server
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: external-docs/package-lock.json
      # Validates the same Makefile package path release.yml docs-bundle uses.
      - name: package docs bundle
        working-directory: external-docs
        shell: bash
        run: |
          set -euo pipefail
          version="v0.0.0-ci"
          all_tags="$(git tag --list 'v*' --sort=-v:refname | tr '\n' ' ')"
          npm ci
          make build VERSION="${version}"
          make build-latest VERSION="${version}"
          make package VERSION="${version}" \
            DOCS_LATEST_VERSION="${version}" \
            DOCS_RELEASE_VERSIONS="${all_tags} ${version}"
          archive="dist/metrum-ai-bench-cli-docs-${version}.tar.gz"
          checksum="${archive}.sha256"
          manifest="dist/metrum-ai-bench-cli-docs-versions.json"
          test -f "${archive}"
          test -f "${checksum}"
          test -f "${manifest}"
          (cd dist && sha256sum -c "metrum-ai-bench-cli-docs-${version}.tar.gz.sha256")
          # Buffer the listing so grep -q cannot SIGPIPE tar under pipefail.
          archive_listing="$(tar -tzf "${archive}")"
          grep -Fq "metrum-ai-bench-cli/${version}/" <<<"${archive_listing}"
          grep -Fq "metrum-ai-bench-cli/latest/" <<<"${archive_listing}"
          grep -Fq "metrum-ai-bench-cli/versions.json" <<<"${archive_listing}"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "${manifest}"
          ls -l dist/

  # Hub dataset must stay public and license-aligned with docs/datasets/DATASET_CARD.md.
  # Manual confirmation that upstream prompt sources permit Apache-2.0 remains a
  # human operator step (not automated here).
  hf-visibility:
    name: hf-visibility (prompt-library)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require public ungated Hub dataset matching local card license
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk '
            BEGIN { in_fm=0 }
            /^---[[:space:]]*$/ { in_fm++; next }
            in_fm == 1 && $1 == "license:" { print $2; exit }
          ' docs/datasets/DATASET_CARD.md)"
          test -n "${expected}"
          echo "local card license: ${expected}"
          curl -sfL "https://huggingface.co/api/datasets/metrum-ai/prompt-library" \
            | jq -e --arg lic "${expected}" '
                .private == false
                and (.gated == false or .gated == null)
                and (
                  (.cardData.license | tostring | ascii_downcase)
                  == ($lic | ascii_downcase)
                )
              '
          echo "hf-visibility: ok"
