name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-latest
    env:
      # Serialize rustc/link to reduce peak memory on GitHub-hosted runners.
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The dummy-server end-to-end tests skip themselves without a Go
      # toolchain, so install one and require it below.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: dummy-model-server/go.sum
      - name: copyright and SPDX headers
        run: bash scripts/check_headers.sh
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-targets --all-features
        env:
          METRUM_BENCH_REQUIRE_DUMMY: "1"
      - name: package dry run
        run: cargo package --allow-dirty

  secrets:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git --redact --verbose

  coverage:
    name: core line coverage (80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: enforce core coverage
        run: >-
          cargo llvm-cov --lib --all-features --fail-under-lines 80
          --ignore-filename-regex
          'src/(args_common|endpoints|error|jsonl|lib|prompt_inputs)\.rs'

  licenses:
    name: dependency licenses (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
