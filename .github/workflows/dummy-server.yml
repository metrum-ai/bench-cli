name: dummy-model-server

on:
  push:
    paths:
      - "dummy-model-server/**"
      - ".github/workflows/dummy-server.yml"
  pull_request:
    paths:
      - "dummy-model-server/**"
      - ".github/workflows/dummy-server.yml"

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dummy-model-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: dummy-model-server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
