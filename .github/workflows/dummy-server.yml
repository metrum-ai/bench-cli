name: dummy-model-server

on:
  push:
    paths:
      - "dummy-model-server/**"
      - ".github/workflows/dummy-server.yml"
  pull_request:
    paths:
      - "dummy-model-server/**"
      - ".github/workflows/dummy-server.yml"

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dummy-model-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: dummy-model-server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
