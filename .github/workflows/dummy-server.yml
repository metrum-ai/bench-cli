name: dummy-model-server

on:
  push:
    paths:
      - "dummy-model-server/**"
      - ".github/workflows/dummy-server.yml"
  pull_request:
    paths:
      - "dummy-model-server/**"
      - ".github/workflows/dummy-server.yml"

# Metrum AI: group PRs for supersession; isolate every non-PR run by run_id.
# Shared non-PR groups replace pending evidence even when cancellation is false.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dummy-model-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: dummy-model-server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
