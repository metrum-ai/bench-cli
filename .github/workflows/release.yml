name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or intended release tag (must match Cargo version)
        type: string
        required: true
      publish_release:
        description: Create or update the GitHub release
        type: boolean
        default: false
      publish_crate:
        description: Publish the crate to crates.io
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Verify the tagged tree, also on workflow_dispatch.
          ref: ${{ env.RELEASE_TAG }}
      - name: Tag must be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "${tag_commit}" origin/main \
            || { echo "::error::${RELEASE_TAG} (${tag_commit}) is not on main"; exit 1; }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify tag and package
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${RELEASE_TAG}" = "v${crate_version}"
          cargo publish --dry-run --locked --features otlp
      # docs/DATA_POINTS.md goes into the release notes, so a stale copy
      # (schema changed, file not regenerated) stops the release (#202).
      - name: Data-point counts are current
        shell: bash
        run: cargo xtask render-data-points --check

  dummy-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
          - target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dummy-model-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: dummy-model-server/go.sum
      - name: Cross-compile dummy-model-server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags='-s -w'
          -o dummy-model-server ./cmd/dummy-model-server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dummy-${{ matrix.target }}
          path: dummy-model-server/dummy-model-server

  artifacts:
    needs: [verify, dummy-binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu with glibc 2.17 floor (older than Ubuntu 24.04-native links).
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            rust_target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
            rust_target: aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            zig_target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
            zig_target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
    runs-on: ubuntu-latest
    # Pinned cargo-zigbuild 0.23.4 (macOS SDK included). Zig links gnu glibc / Darwin.
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild@sha256:d8313491ec5798de0633fdc1c5753761bff79967bea69076020dc78121b2cca8
      options: --user root
    env:
      # Keep cargo/zig on PATH even if a step uses a login shell.
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SDKROOT: /opt/MacOSX11.3.sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dummy-${{ matrix.target }}
          path: dummy-bin
      - name: Add Rust target
        run: rustup target add "${{ matrix.rust_target }}"
      - name: cargo zigbuild
        run: >-
          cargo zigbuild --locked --release --features otlp
          --target "${{ matrix.zig_target }}" --bins
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          root="metrum-ai-bench-cli-v${version}-${{ matrix.target }}"
          mkdir -p "${root}/bin"
          mapfile -t bins < <(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          meta = json.load(sys.stdin)
          for target in meta["packages"][0]["targets"]:
              if "bin" in target.get("kind", []):
                  print(target["name"])
          ')
          for name in "${bins[@]}"; do
            path="target/${{ matrix.rust_target }}/release/${name}"
            if [[ -x "${path}" ]]; then cp "${path}" "${root}/bin/"; fi
          done
          cp dummy-bin/dummy-model-server "${root}/bin/dummy-model-server"
          chmod 0755 "${root}/bin/dummy-model-server"
          test -x "${root}/bin/metrum-ai-bench-cli"
          test -x "${root}/bin/metrum-ai-bench-cli-mock-server"
          test -x "${root}/bin/dummy-model-server"
          cp LICENSE NOTICE THIRD_PARTY_LICENSES README.md TRADEMARKS.md "${root}/"
          mkdir -p "${root}/docs"
          cp docs/RESULTS_PUBLICATION_POLICY.md docs/CLAIMS_LEDGER.md \
             docs/NAMING.md "${root}/docs/"
          cp -a examples "${root}/"
          cp -a test-data "${root}/"
          tar -czf "${root}.tar.gz" "${root}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${root}.tar.gz" > "${root}.tar.gz.sha256"
          else
            sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"
          fi
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          mv metrum-ai-bench-cli.cdx.json "metrum-ai-bench-cli-${{ matrix.target }}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz
            metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz.sha256
            metrum-ai-bench-cli-${{ matrix.target }}.cdx.json

  artifact-sign:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign with Sigstore keyless identity
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz)"
          cosign sign-blob --yes \
            --bundle "${archive}.sigstore.json" "${archive}"
      # Build provenance attestation is required (repository is public).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ matrix.target }}
          path: |
            metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz*
            metrum-ai-bench-cli-${{ matrix.target }}.cdx.json

  smoke-linux:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
      - name: Unpack and smoke
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz)"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c "${archive}.sha256"
          else
            sha256sum -c "${archive}.sha256"
          fi
          tar -xzf "${archive}"
          root="${archive%.tar.gz}"
          test -f "${root}/TRADEMARKS.md"
          test -f "${root}/docs/RESULTS_PUBLICATION_POLICY.md"
          test -f "${root}/docs/CLAIMS_LEDGER.md"
          test -f "${root}/examples/sut.example.json"
          test -f "${root}/test-data/llm-hi.jsonl"
          test -f "${root}/NOTICE"
          test -f "${root}/THIRD_PARTY_LICENSES"
          test -f "${root}/test-data/asr/input.jsonl"
          test -f "${root}/test-data/asr/truth.jsonl"
          wavs=("${root}"/test-data/asr/*.wav); test "${#wavs[@]}" -eq 3
          test -f "${root}/test-data/vlm/shapes-512.png"
          test -f "${root}/test-data/vlm/prompts.jsonl"
          test -f "${root}/test-data/negative/header-only-invalid.mp3"
          test ! -e "${root}/test-data/dummy.mp3"
          "${root}/bin/metrum-ai-bench-cli" --help | grep -qi benchmark
          "${root}/bin/metrum-ai-bench-cli" selftest
          "${root}/bin/metrum-ai-bench-cli-mock-server" --help | grep -qi mock
          dummy_help="$("${root}/bin/dummy-model-server" -h 2>&1 || true)"
          printf '%s\n' "${dummy_help}" | grep -qi 'Listen port'

  smoke-macos:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
      - name: Unpack and smoke
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls metrum-ai-bench-cli-v*-${{ matrix.target }}.tar.gz)"
          shasum -a 256 -c "${archive}.sha256"
          tar -xzf "${archive}"
          root="${archive%.tar.gz}"
          test -f "${root}/TRADEMARKS.md"
          test -f "${root}/docs/RESULTS_PUBLICATION_POLICY.md"
          test -f "${root}/docs/CLAIMS_LEDGER.md"
          test -f "${root}/examples/sut.example.json"
          test -f "${root}/test-data/llm-hi.jsonl"
          test -f "${root}/NOTICE"
          test -f "${root}/THIRD_PARTY_LICENSES"
          test -f "${root}/test-data/asr/input.jsonl"
          test -f "${root}/test-data/asr/truth.jsonl"
          wavs=("${root}"/test-data/asr/*.wav); test "${#wavs[@]}" -eq 3
          test -f "${root}/test-data/vlm/shapes-512.png"
          test -f "${root}/test-data/vlm/prompts.jsonl"
          test -f "${root}/test-data/negative/header-only-invalid.mp3"
          test ! -e "${root}/test-data/dummy.mp3"
          "${root}/bin/metrum-ai-bench-cli" --help | grep -qi benchmark
          "${root}/bin/metrum-ai-bench-cli" selftest
          "${root}/bin/metrum-ai-bench-cli-mock-server" --help | grep -qi mock
          dummy_help="$("${root}/bin/dummy-model-server" -h 2>&1 || true)"
          printf '%s\n' "${dummy_help}" | grep -qi 'Listen port'

  docs-bundle:
    # docs.metrum.ai content ships as a Release asset next to the binaries.
    # The docs web host pulls the newest Release bundle on its own schedule
    # (metrum-internal-infra-admin: newsite/scripts/sync-metrum-ai-bench-cli-docs.sh),
    # so no self-hosted runner, host path, or Docker access is needed here.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: external-docs/package-lock.json
      - name: Build and package docs
        working-directory: external-docs
        shell: bash
        run: |
          set -euo pipefail
          # Same prerelease test as github-release below: an rc never
          # promotes /latest/, it only gets its own versioned path.
          is_prerelease() {
            case "$1" in
              *-rc.*|*-alpha.*|*-beta.*) return 0 ;;
              *) return 1 ;;
            esac
          }
          all_tags="$(git tag --list 'v*' --sort=-v:refname | tr '\n' ' ')"
          npm ci
          make build VERSION="${RELEASE_TAG}"
          if is_prerelease "${RELEASE_TAG}"; then
            latest=""
            for t in ${all_tags}; do
              if ! is_prerelease "${t}"; then latest="${t}"; break; fi
            done
            latest="${latest:-${RELEASE_TAG}-fallback}"
          else
            latest="${RELEASE_TAG}"
            make build-latest VERSION="${RELEASE_TAG}"
          fi
          make package VERSION="${RELEASE_TAG}" \
            DOCS_LATEST_VERSION="${latest}" \
            DOCS_RELEASE_VERSIONS="${all_tags}"
          ls -l dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-docs
          path: |
            external-docs/dist/metrum-ai-bench-cli-docs-*.tar.gz
            external-docs/dist/metrum-ai-bench-cli-docs-*.tar.gz.sha256
            external-docs/dist/metrum-ai-bench-cli-docs-versions.json
          if-no-files-found: error

  live-gate:
    # Real-backend smoke for every modality (live-modality-smoke.yml). Opt-in
    # with repository variable LIVE_GATE_REQUIRED=true once a gpu-h100
    # runner is registered; while unset the job is skipped and publishing
    # proceeds as before. docs/RELEASING.md still requires a green gate.
    needs: verify
    if: vars.LIVE_GATE_REQUIRED == 'true'
    uses: ./.github/workflows/live-modality-smoke.yml
    with:
      from_release: true
      ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    secrets: inherit

  github-release:
    # always() so a skipped live-gate (variable unset) does not skip publish;
    # every other dependency must still succeed.
    if: >-
      always() &&
      needs.artifact-sign.result == 'success' &&
      needs.smoke-linux.result == 'success' &&
      needs.smoke-macos.result == 'success' &&
      needs.docs-bundle.result == 'success' &&
      (needs.live-gate.result == 'success' || needs.live-gate.result == 'skipped') &&
      (github.event_name == 'push' || inputs.publish_release == true)
    needs: [artifact-sign, smoke-linux, smoke-macos, docs-bundle, live-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Notes describe the tagged schemas, also on workflow_dispatch.
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-signed-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-docs
      # The full body is built here (GitHub's generated notes, then the
      # data-point counts, #202) so a re-run or a dispatch on an existing
      # release writes the same notes instead of replacing them.
      - name: Release notes with data points
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" --jq .body > release-notes.md
          printf '\n' >> release-notes.md
          cargo xtask release-notes-data-points >> release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          # Infer prerelease from the tag so -rc.N never becomes GitHub Latest.
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc.') || contains(env.RELEASE_TAG, '-alpha.') || contains(env.RELEASE_TAG, '-beta.') }}
          generate_release_notes: false
          files: |
            *.tar.gz
            *.sha256
            *.sigstore.json
            *.cdx.json
            metrum-ai-bench-cli-docs-versions.json

  crates-io:
    # Deliberate gate: never publish -rc. tags; require CRATES_IO_PUBLISH=true.
    # workflow_dispatch publish_crate is allowed only for non-rc release tags.
    if: >-
      always() &&
      needs.smoke-linux.result == 'success' &&
      needs.smoke-macos.result == 'success' &&
      (needs.live-gate.result == 'success' || needs.live-gate.result == 'skipped') &&
      vars.CRATES_IO_PUBLISH == 'true' &&
      (
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          !contains(github.ref, '-rc.')
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_crate == true &&
          startsWith(inputs.release_tag, 'v') &&
          !contains(inputs.release_tag, '-rc.')
        )
      )
    needs: [smoke-linux, smoke-macos, live-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # A missing token is a configuration choice, not a broken release: the
      # tarballs, SBOMs and signatures are already published by then.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CRATES_IO_TOKEN is not configured; skipping the crates.io publish."
            exit 0
          fi
          cargo publish --locked --features otlp
