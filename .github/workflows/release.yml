name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or intended release tag (must match Cargo version)
        type: string
        required: true
      publish_release:
        description: Create or update the GitHub release
        type: boolean
        default: false
      publish_crate:
        description: Publish the crate to crates.io
        type: boolean
        default: false
      publish_homebrew:
        description: Commit the generated formula to the configured tap
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Verify tag and package
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${RELEASE_TAG}" = "v${crate_version}"
          cargo publish --dry-run --locked --features otlp

  artifacts:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu with glibc 2.17 floor (older than Ubuntu 24.04-native links).
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            rust_target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
            rust_target: aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            zig_target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
            zig_target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
    runs-on: ubuntu-latest
    # Pinned cargo-zigbuild 0.23.4 (macOS SDK included). Zig links gnu glibc / Darwin.
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild@sha256:d8313491ec5798de0633fdc1c5753761bff79967bea69076020dc78121b2cca8
      options: --user root
    env:
      # Keep cargo/zig on PATH even if a step uses a login shell.
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SDKROOT: /opt/MacOSX11.3.sdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Add Rust target
        run: rustup target add "${{ matrix.rust_target }}"
      - name: cargo zigbuild
        run: >-
          cargo zigbuild --locked --release --features otlp
          --target "${{ matrix.zig_target }}" --bins
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          root="metrumbench-v${version}-${{ matrix.target }}"
          mkdir -p "${root}/bin"
          mapfile -t bins < <(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          meta = json.load(sys.stdin)
          for target in meta["packages"][0]["targets"]:
              if "bin" in target.get("kind", []):
                  print(target["name"])
          ')
          for name in "${bins[@]}"; do
            path="target/${{ matrix.rust_target }}/release/${name}"
            if [[ -x "${path}" ]]; then cp "${path}" "${root}/bin/"; fi
          done
          test -x "${root}/bin/metrum-ai-bench"
          test -x "${root}/bin/metrumbench-mock-server"
          cp LICENSE README.md "${root}/"
          tar -czf "${root}.tar.gz" "${root}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${root}.tar.gz" > "${root}.tar.gz.sha256"
          else
            sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256"
          fi
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          mv metrumbench.cdx.json "metrumbench-${{ matrix.target }}.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            metrumbench-v*-${{ matrix.target }}.tar.gz
            metrumbench-v*-${{ matrix.target }}.tar.gz.sha256
            metrumbench-${{ matrix.target }}.cdx.json

  artifact-sign:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-${{ matrix.target }}
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
      - name: Sign with Sigstore keyless identity
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls metrumbench-v*-${{ matrix.target }}.tar.gz)"
          cosign sign-blob --yes \
            --bundle "${archive}.sigstore.json" "${archive}"
      # Artifact attestations require a public repo or a billing plan that
      # enables the feature; do not fail the release when unavailable.
      - uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        continue-on-error: true
        with:
          subject-path: metrumbench-v*-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signed-${{ matrix.target }}
          path: |
            metrumbench-v*-${{ matrix.target }}.tar.gz*
            metrumbench-${{ matrix.target }}.cdx.json

  smoke-linux:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-${{ matrix.target }}
      - name: Unpack and smoke
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls metrumbench-v*-${{ matrix.target }}.tar.gz)"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c "${archive}.sha256"
          else
            sha256sum -c "${archive}.sha256"
          fi
          tar -xzf "${archive}"
          root="${archive%.tar.gz}"
          "${root}/bin/metrum-ai-bench" --help | grep -qi benchmark
          "${root}/bin/metrum-ai-bench" selftest
          "${root}/bin/metrumbench-mock-server" --help | grep -qi mock

  smoke-macos:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-${{ matrix.target }}
      - name: Unpack and smoke
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls metrumbench-v*-${{ matrix.target }}.tar.gz)"
          shasum -a 256 -c "${archive}.sha256"
          tar -xzf "${archive}"
          root="${archive%.tar.gz}"
          "${root}/bin/metrum-ai-bench" --help | grep -qi benchmark
          "${root}/bin/metrum-ai-bench" selftest
          "${root}/bin/metrumbench-mock-server" --help | grep -qi mock

  github-release:
    if: >-
      github.event_name == 'push' ||
      inputs.publish_release == true ||
      inputs.publish_homebrew == true
    needs: [artifact-sign, smoke-linux, smoke-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: release-signed-*
          merge-multiple: true
      - name: Generate release Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/render_homebrew_formula.sh "${RELEASE_TAG}" . metrumbench.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-formula
          path: metrumbench.rb
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Infer prerelease from the tag so -rc.N never becomes GitHub Latest.
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc.') || contains(env.RELEASE_TAG, '-alpha.') || contains(env.RELEASE_TAG, '-beta.') }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256
            *.sigstore.json
            *.cdx.json
            metrumbench.rb

  crates-io:
    if: github.event_name == 'push' || inputs.publish_crate == true
    needs: [smoke-linux, smoke-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # A missing token is a configuration choice, not a broken release: the
      # tarballs, SBOMs and signatures are already published by then.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CRATES_IO_TOKEN is not configured; skipping the crates.io publish."
            exit 0
          fi
          cargo publish --locked --features otlp

  homebrew:
    if: >-
      vars.HOMEBREW_TAP_REPOSITORY != '' &&
      (github.event_name == 'push' || inputs.publish_homebrew == true)
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: homebrew-formula
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          ref: ${{ vars.HOMEBREW_TAP_BRANCH || 'main' }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish formula
        shell: bash
        env:
          TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp metrumbench.rb homebrew-tap/Formula/metrumbench.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/metrumbench.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "metrumbench ${RELEASE_TAG#v}"
          git push origin "HEAD:${TAP_BRANCH}"
