name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or intended release tag (must match Cargo version)
        type: string
        required: true
      publish_release:
        description: Create or update the GitHub release
        type: boolean
        default: false
      publish_crate:
        description: Publish the crate to crates.io
        type: boolean
        default: false
      publish_homebrew:
        description: Commit the generated formula to the configured tap
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and package
        shell: bash
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${RELEASE_TAG}" = "v${crate_version}"
          cargo publish --dry-run --locked --features otlp

  artifacts:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --features otlp --target "${{ matrix.target }}" --bins
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          root="metrumbench-v${version}-${{ matrix.target }}"
          mkdir -p "${root}/bin"
          while IFS= read -r name; do
            path="target/${{ matrix.target }}/release/${name}"
            if [[ -x "${path}" ]]; then cp "${path}" "${root}/bin/"; fi
          done < <(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[0].targets[] | select(.kind | index("bin")) | .name')
          test -x "${root}/bin/metrum-ai-bench"
          test -x "${root}/bin/metrumbench-mock-server"
          cp LICENSE README.md "${root}/"
          tar -czf "${root}.tar.gz" "${root}"
          shasum -a 256 "${root}.tar.gz" > "${root}.tar.gz.sha256"
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          mv metrumbench.cdx.json "metrumbench-${{ matrix.target }}.cdx.json"
      - uses: sigstore/cosign-installer@v3
      - name: Sign with Sigstore keyless identity
        shell: bash
        run: |
          archive="$(ls metrumbench-v*-${{ matrix.target }}.tar.gz)"
          cosign sign-blob --yes \
            --bundle "${archive}.sigstore.json" "${archive}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: metrumbench-v*-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            metrumbench-v*-${{ matrix.target }}.tar.gz*
            metrumbench-${{ matrix.target }}.cdx.json

  github-release:
    if: >-
      github.event_name == 'push' ||
      inputs.publish_release == true ||
      inputs.publish_homebrew == true
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Generate release Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/render_homebrew_formula.sh "${RELEASE_TAG}" . metrumbench.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: metrumbench.rb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256
            *.sigstore.json
            *.cdx.json
            metrumbench.rb

  crates-io:
    if: github.event_name == 'push' || inputs.publish_crate == true
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A missing token is a configuration choice, not a broken release: the
      # tarballs, SBOMs and signatures are already published by then.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CRATES_IO_TOKEN is not configured; skipping the crates.io publish."
            exit 0
          fi
          cargo publish --locked --features otlp

  homebrew:
    if: >-
      vars.HOMEBREW_TAP_REPOSITORY != '' &&
      (github.event_name == 'push' || inputs.publish_homebrew == true)
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          ref: ${{ vars.HOMEBREW_TAP_BRANCH || 'main' }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Publish formula
        shell: bash
        env:
          TAP_BRANCH: ${{ vars.HOMEBREW_TAP_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp metrumbench.rb homebrew-tap/Formula/metrumbench.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/metrumbench.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "metrumbench ${RELEASE_TAG#v}"
          git push origin "HEAD:${TAP_BRANCH}"
