[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
description = "Internal CI and release gate tasks for metrum-ai-bench-cli"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.2"
png = "0.18.1"
regex = { version = "1.13.1", features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
