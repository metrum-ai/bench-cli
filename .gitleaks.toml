# Fake fixtures for gitleaks custom-rule regression tests. Values are not real.
title = "metrum-ai-bench gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "aws-account-id-near-account"
description = "12-digit AWS account ID adjacent to account wording"
regex = '''(?i)account[^0-9]{0,40}\b\d{12}\b|\b\d{12}\b[^0-9]{0,40}account'''
keywords = ["account"]

[[rules]]
id = "cleartext-password-assignment"
description = "Cleartext password assignment"
regex = '''(?i)password\s*[:=]\s*\S+'''
keywords = ["password"]

[[rules]]
id = "ssh-public-key-material"
description = "SSH public key material (rsa/ed25519)"
regex = '''ssh-(rsa|ed25519)\s+AAAA[0-9A-Za-z+/=]+'''
keywords = ["ssh-rsa", "ssh-ed25519"]

[[rules]]
id = "internal-hostname-suffix"
description = "Internal hostname matching the org suffix pattern"
# Suffix only (from historical leak class); do not embed host labels here.
regex = '''(?i)\b[a-z0-9][a-z0-9.-]*\.metrum\.ai\b'''
keywords = ["metrum.ai"]

[[allowlists]]
description = "Fixture dir + pre-#44 history that still contains the removed leak class (tree is clean; Phase 3/GitHub purge for tags)"
paths = [
  '''scripts/tests/gitleaks/''',
]
commits = [
  "59afa0ed12614de0e072c0ea304b2ae604177fa7",
  "a3947d4af8add3e7aeb4daf8754bb2a2e8e745cf",
  "bffdb7f79d0a38c94c42a23ba4d9f81d85a3155e",
  "da80829d17502688b50d08e5ea1145e6c7082531"
]

# Public customer docs site (not an internal host).
[[allowlists]]
description = "Allow public docs.metrum.ai hostname in customer-facing docs URLs"
regexes = [
  '''(?i)\bdocs\.metrum\.ai\b''',
]
